match:
  output_dir: outputs/heatmap_{match_id}

video:
  width: 1920
  height: 1080
  fps: 60

sampling:
  start_seconds: 20.0
  sample_fps: 1.0

map_view:
  coordinate_space: video_pixels
  reference_time_seconds: 60.0
  roi:
    x1: 0
    y1: 180
    x2: 1760
    y2: 980
  exclude_regions:
    - name: top_status_bar
      x1: 0
      y1: 0
      x2: 1920
      y2: 180
    - name: right_operation_hints
      x1: 1640
      y1: 650
      x2: 1920
      y2: 980
    - name: bottom_menu
      x1: 1450
      y1: 980
      x2: 1920
      y2: 1080

stage_coordinates:
  stage_id: "{match_id}_stage"
  allow_roi_fallback: true

frame_quality:
  min_ink_ratio: 0.06
  max_large_overlay_ratio: 0.35

teams:
  yellow:
    hsv_ranges:
      - lower: [20, 80, 80]
        upper: [45, 255, 255]
  blue:
    hsv_ranges:
      - lower: [105, 80, 80]
        upper: [140, 255, 255]

marker_detection:
  method: label_guided_color_components
  min_component_area: 8
  max_component_area: 900
  min_component_width: 3
  max_component_width: 80
  min_component_height: 3
  max_component_height: 80
  min_confidence: 0.45
  label_proximity_px: 55
  max_points_per_team_per_frame: 4
  merge_distance_px: 24
  debug_frame_limit: 36

label_detection:
  white_hsv_lower: [0, 0, 145]
  white_hsv_upper: [179, 105, 255]
  min_label_area: 10
  max_label_area: 1600
  min_label_width: 8
  max_label_width: 220
  min_label_height: 5
  max_label_height: 60

point_cleaning:
  min_confidence: 0.50
  max_points_per_team_per_frame: 4
  merge_distance_px: 18
  track_slots_per_team: 4
  max_track_step_px: 420
  max_track_speed_px_per_second: 360
  max_track_gap_seconds: 3.0
  max_matched_gap_seconds: 0.5
  max_matched_step_px: 120
  prediction_horizon_seconds: 1.0
  min_assignment_gate_px: 45
  assignment_confidence_weight_px: 30
  velocity_smoothing_alpha: 0.65
  debug_reference_time_seconds: 60.0

rendering:
  reference_time_seconds: 60.0
  heat_point_radius_px: 22
  heat_blur_sigma_px: 34
  heat_max_alpha: 0.58
  heat_low_cutoff: 0.10
  heat_contrast_gamma: 1.60
  heat_peak_boost: 1.00
  all_heat_colormap: turbo
  all_heat_min_alpha: 0.12
  all_heat_max_alpha: 0.52
  all_heat_legend: true
  map_saturation: 0.12
  map_brightness: 0.70
  route_line_thickness_px: 2
  route_point_radius_px: 4
  route_max_draw_step_px: 120
  outside_mask_dim: 0.30
  heat_scale_percentile: 99.85

state_join:
  state_csv: "{output_dir}/ui_state.csv"
  max_time_delta_seconds: 0.51
  fields:
    - count_left
    - count_right
    - penalty_left
    - penalty_right
    - asari_count
    - hoko_count
    - area_count
    - yagura_count
    - message
    - player_detected
    - player_state_1
    - player_state_2
    - player_state_3
    - player_state_4
    - player_state_5
    - player_state_6
    - player_state_7
    - player_state_8
    - weapon_1
    - weapon_2
    - weapon_3
    - weapon_4
    - weapon_5
    - weapon_6
    - weapon_7
    - weapon_8

event_join:
  event_csv: "{output_dir}/death_events.csv"
  time_window_seconds: 2.0
  segment_gap_seconds: 5.0

death_events:
  dead_state_ids: [1, 3]
  alive_state_ids: [0, 14, 20]
  min_dead_frames: 1
  include_initial_dead: false

identity_tracking:
  method: team_slot_weapon_hint
  route_max_draw_step_px: 120
  route_line_thickness_px: 2
  route_point_radius_px: 4
  base_identity_confidence: 0.30
  matched_bonus: 0.12
  weapon_hint_bonus: 0.08
  jump_reset_penalty: 0.15
  slot_mapping_verified: false
  death_pre_window_seconds: 3.0
  death_post_window_seconds: 2.0
  death_max_point_delta_seconds: 2.0
  death_ambiguity_margin: 0.12

outputs:
  frames_dir: "{output_dir}/frames"
  probes_dir: "{output_dir}/probes"
  debug_markers_dir: "{output_dir}/debug_markers"
  valid_frames_csv: "{output_dir}/valid_frames.csv"
  invalid_frames_csv: "{output_dir}/invalid_frames.csv"
  raw_points_csv: "{output_dir}/team_points_raw.csv"
  clean_points_csv: "{output_dir}/team_points.csv"
  tracks_csv: "{output_dir}/team_tracks.csv"
  rejected_points_csv: "{output_dir}/team_points_rejected.csv"
  cleaning_report_csv: "{output_dir}/point_cleaning_report.csv"
  cleaning_debug_dir: "{output_dir}/cleaning_debug"
  rendered_dir: "{output_dir}/rendered"
  render_report_csv: "{output_dir}/render_report.csv"
  enriched_points_csv: "{output_dir}/team_points_enriched.csv"
  state_join_report_csv: "{output_dir}/state_join_report.csv"
  event_template_csv: "{output_dir}/events_template.csv"
  points_with_events_csv: "{output_dir}/team_points_events.csv"
  events_near_points_csv: "{output_dir}/events_near_points.csv"
  event_segments_csv: "{output_dir}/event_segments.csv"
  event_join_report_csv: "{output_dir}/event_join_report.csv"
  player_tracks_csv: "{output_dir}/player_tracks.csv"
  player_tracks_stage_csv: "{output_dir}/player_tracks_stage.csv"
  rendered_stage_dir: "{output_dir}/rendered_stage"
  death_events_csv: "{output_dir}/death_events.csv"
  death_events_json: "{output_dir}/death_events.json"
  death_positions_csv: "{output_dir}/death_positions.csv"
  death_position_report_json: "{output_dir}/death_position_report.json"
  routes_with_deaths: "{output_dir}/rendered/routes_with_deaths.png"
  stage_routes_with_deaths: "{output_dir}/rendered_stage/stage_routes_with_deaths.png"
  player_track_gaps_csv: "{output_dir}/player_track_gaps.csv"
  player_routes_dir: "{output_dir}/player_routes"
  identity_report_csv: "{output_dir}/identity_report.csv"
  map_roi_debug: "{output_dir}/map_roi_debug.jpg"
  map_mask: "{output_dir}/map_mask.png"
  report_md: "{output_dir}/report.md"

data_schema:
  team_points_columns:
    - match_id
    - time
    - frame_index
    - team
    - player_id
    - x
    - y
    - confidence
    - source
    - clean_stage
    - frame_path
  team_tracks_columns:
    - match_id
    - time
    - frame_index
    - team
    - track_slot
    - x
    - y
    - confidence
    - track_status
    - step_distance
    - frame_path

color_calibration:
  enabled: true
  reference_time_seconds: 60.0
  sample_offsets_seconds: [-4, -2, 0, 2, 4]
  sample_region: top_icon_regions
  order_by: top_bar_x
