match:
  id: match_9
  input_video: footages/match_9.mp4
  output_dir: outputs/heatmap_match9

video:
  width: 1920
  height: 1080
  fps: 60
  duration_seconds: 308.07

sampling:
  # Full playable overhead-map window: the GO overlay clears at about 16 s,
  # and the replay enters the result sequence shortly after 160 s.
  start_seconds: 16.0
  stop_seconds: 160.0
  # Five map observations per second keep death-adjacent positions and fast
  # movement visible without requiring full 60 FPS processing.
  sample_fps: 5.0

map_view:
  # First pass uses source-video pixel coordinates. Later goals may add
  # homography to a standard stage map.
  coordinate_space: video_pixels
  reference_time_seconds: 60.0
  roi:
    x1: 0
    y1: 180
    x2: 1760
    y2: 980
  exclude_regions:
    - name: top_status_bar
      x1: 0
      y1: 0
      x2: 1920
      y2: 180
    - name: right_operation_hints
      x1: 1640
      y1: 650
      x2: 1920
      y2: 980
    - name: bottom_menu
      x1: 1450
      y1: 980
      x2: 1920
      y2: 1080

stage_coordinates:
  stage_id: match9_stage
  # ROI normalization is usable within this match. Cross-match comparisons
  # require a promoted real-landmark control-point asset.
  allow_roi_fallback: true

frame_quality:
  # The first playable seconds have little ink but already contain useful
  # player markers, so validity cannot require a mature paint footprint.
  min_ink_ratio: 0.01
  max_large_overlay_ratio: 0.35
  invalid_ranges_seconds:
    - [0.0, 15.9]
    - [170.0, 308.1]

teams:
  yellow:
    hsv_ranges:
      - lower: [20, 80, 80]
        upper: [45, 255, 255]
  blue:
    hsv_ranges:
      - lower: [105, 80, 80]
        upper: [140, 255, 255]

marker_detection:
  # Identity comes from the stable player name, while the emitted coordinate
  # must also match the downward triangle below it. Tracking starts at 60 s and
  # runs in both directions so early frames never start from a global guess.
  method: seeded_name_marker_tracking
  reference_time_seconds: 60.0
  template_edge_low: 80
  template_edge_high: 160
  template_marker_radius_px: 8
  template_marker_search_radius_px: 8
  template_tracked_min_score: 0.10
  template_reacquire_min_score: 0.42
  template_marker_tracked_min_score: 0.16
  template_marker_reacquire_min_score: 0.28
  template_max_gap_seconds: 2.0
  template_max_speed_px_per_second: 140
  template_min_search_gate_px: 45
  template_collision_distance_px: 26
  player_templates:
    - player_id: yellow_player_1
      team: yellow
      # HUD order verified by matching the result-screen weapon icon to the
      # top status bar: 2=black/red shooter, player name しぐれ.
      track_slot: 2
      reference_box: [745, 260, 813, 291]
      reference_marker: [788, 311]
    - player_id: yellow_player_2
      team: yellow
      track_slot: 1
      reference_box: [648, 335, 747, 369]
      reference_marker: [696, 376]
    - player_id: yellow_player_3
      team: yellow
      track_slot: 3
      reference_box: [575, 384, 717, 421]
      reference_marker: [649, 425]
    - player_id: yellow_player_4
      team: yellow
      track_slot: 4
      reference_box: [1058, 383, 1232, 421]
      reference_marker: [1147, 424]
    - player_id: blue_player_1
      team: blue
      # CM-Perii is the fourth blue HUD/result row.
      track_slot: 4
      reference_box: [737, 552, 856, 582]
      reference_marker: [793, 589]
    - player_id: blue_player_2
      team: blue
      # aka-chan is the third blue HUD/result row.
      track_slot: 3
      reference_box: [797, 584, 892, 613]
      reference_marker: [845, 624]
    - player_id: blue_player_3
      team: blue
      # danshari-danshaku is the second blue HUD/result row.
      track_slot: 2
      reference_box: [936, 583, 1108, 614]
      reference_marker: [1019, 625]
    - player_id: blue_player_4
      team: blue
      track_slot: 1
      reference_box: [915, 716, 984, 743]
      reference_marker: [949, 749]
  min_component_area: 8
  max_component_area: 900
  min_component_width: 3
  max_component_width: 80
  min_component_height: 3
  max_component_height: 80
  min_confidence: 0.45
  label_proximity_px: 55
  max_points_per_team_per_frame: 4
  merge_distance_px: 24
  debug_frame_limit: 36

label_detection:
  white_hsv_lower: [0, 0, 145]
  white_hsv_upper: [179, 105, 255]
  min_label_area: 10
  max_label_area: 1600
  min_label_width: 8
  max_label_width: 220
  min_label_height: 5
  max_label_height: 60

point_cleaning:
  min_confidence: 0.50
  max_points_per_team_per_frame: 4
  merge_distance_px: 18
  track_slots_per_team: 4
  max_track_step_px: 420
  max_track_speed_px_per_second: 360
  max_track_gap_seconds: 3.0
  max_matched_gap_seconds: 0.5
  max_matched_step_px: 120
  prediction_horizon_seconds: 1.0
  min_assignment_gate_px: 45
  assignment_confidence_weight_px: 30
  velocity_smoothing_alpha: 0.65
  debug_reference_time_seconds: 60.0

rendering:
  reference_time_seconds: 60.0
  heat_point_radius_px: 22
  heat_blur_sigma_px: 34
  heat_max_alpha: 0.58
  heat_low_cutoff: 0.10
  heat_contrast_gamma: 1.60
  heat_peak_boost: 1.00
  all_heat_colormap: turbo
  all_heat_min_alpha: 0.12
  all_heat_max_alpha: 0.52
  all_heat_legend: true
  map_saturation: 0.12
  map_brightness: 0.70
  route_line_thickness_px: 2
  route_point_radius_px: 4
  route_max_draw_step_px: 120
  outside_mask_dim: 0.30
  heat_scale_percentile: 99.85

state_join:
  state_csv: outputs/heatmap_match9/ui_state.csv
  max_time_delta_seconds: 0.51
  fields:
    - count_left
    - count_right
    - penalty_left
    - penalty_right
    - asari_count
    - hoko_count
    - area_count
    - yagura_count
    - message
    - player_detected
    - player_state_1
    - player_state_2
    - player_state_3
    - player_state_4
    - player_state_5
    - player_state_6
    - player_state_7
    - player_state_8
    - weapon_1
    - weapon_2
    - weapon_3
    - weapon_4
    - weapon_5
    - weapon_6
    - weapon_7
    - weapon_8

event_join:
  event_csv: outputs/heatmap_match9/death_events.csv
  time_window_seconds: 2.0
  segment_gap_seconds: 5.0

death_events:
  # Current the_model.pt: alive=0, dead=3, special=20. Legacy dead=1 is
  # retained by the library default for older analysis CSV files.
  dead_state_ids: [3]
  alive_state_ids: [0, 20]
  min_dead_frames: 1
  include_initial_dead: false

identity_tracking:
  method: team_slot_weapon_hint
  route_max_draw_step_px: 120
  route_line_thickness_px: 2
  route_point_radius_px: 4
  base_identity_confidence: 0.30
  identified_base_confidence: 0.70
  matched_bonus: 0.12
  weapon_hint_bonus: 0.08
  jump_reset_penalty: 0.15
  # Verified for match_9 by matching each result-screen name/weapon row to the
  # same weapon icon in the top HUD. This is replay-specific evidence.
  slot_mapping_verified: true
  death_pre_window_seconds: 3.0
  death_post_window_seconds: 2.0
  death_max_point_delta_seconds: 2.0
  death_ambiguity_margin: 0.12

outputs:
  frames_dir: outputs/heatmap_match9/frames
  probes_dir: outputs/heatmap_match9/probes
  debug_markers_dir: outputs/heatmap_match9/debug_markers
  valid_frames_csv: outputs/heatmap_match9/valid_frames.csv
  invalid_frames_csv: outputs/heatmap_match9/invalid_frames.csv
  raw_points_csv: outputs/heatmap_match9/team_points_raw.csv
  clean_points_csv: outputs/heatmap_match9/team_points.csv
  tracks_csv: outputs/heatmap_match9/team_tracks.csv
  rejected_points_csv: outputs/heatmap_match9/team_points_rejected.csv
  cleaning_report_csv: outputs/heatmap_match9/point_cleaning_report.csv
  cleaning_debug_dir: outputs/heatmap_match9/cleaning_debug
  rendered_dir: outputs/heatmap_match9/rendered
  render_report_csv: outputs/heatmap_match9/render_report.csv
  enriched_points_csv: outputs/heatmap_match9/team_points_enriched.csv
  state_join_report_csv: outputs/heatmap_match9/state_join_report.csv
  event_template_csv: outputs/heatmap_match9/events_template.csv
  points_with_events_csv: outputs/heatmap_match9/team_points_events.csv
  events_near_points_csv: outputs/heatmap_match9/events_near_points.csv
  event_segments_csv: outputs/heatmap_match9/event_segments.csv
  event_join_report_csv: outputs/heatmap_match9/event_join_report.csv
  player_tracks_csv: outputs/heatmap_match9/player_tracks.csv
  player_tracks_stage_csv: outputs/heatmap_match9/player_tracks_stage.csv
  rendered_stage_dir: outputs/heatmap_match9/rendered_stage
  death_events_csv: outputs/heatmap_match9/death_events.csv
  death_events_json: outputs/heatmap_match9/death_events.json
  death_positions_csv: outputs/heatmap_match9/death_positions.csv
  death_position_report_json: outputs/heatmap_match9/death_position_report.json
  routes_with_deaths: outputs/heatmap_match9/rendered/routes_with_deaths.png
  stage_routes_with_deaths: outputs/heatmap_match9/rendered_stage/stage_routes_with_deaths.png
  player_track_gaps_csv: outputs/heatmap_match9/player_track_gaps.csv
  player_routes_dir: outputs/heatmap_match9/player_routes
  identity_report_csv: outputs/heatmap_match9/identity_report.csv
  map_roi_debug: outputs/heatmap_match9/map_roi_debug.jpg
  map_mask: outputs/heatmap_match9/map_mask.png
  report_md: outputs/heatmap_match9/report.md

data_schema:
  team_points_columns:
    - match_id
    - time
    - frame_index
    - team
    - player_id
    - x
    - y
    - confidence
    - source
    - clean_stage
    - frame_path
  team_tracks_columns:
    - match_id
    - time
    - frame_index
    - team
    - track_slot
    - x
    - y
    - confidence
    - track_status
    - step_distance
    - frame_path
